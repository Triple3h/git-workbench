        },
        {

      ].map((commit, index) => {
        const person = people[index % people.length];
        return {

          author: person[0],
          email: person[1],
        };
      });

      const commitByHash = new Map(commits.map((commit) => [commit.hash, commit]));

      const branchTips = {
        develop: "7f3a1b2",
        HEAD: "7f3a1b2",
        "feature/git-panel": "3b8f5a1",
        "hotfix/rename": "a3d8e2f",
        "experiment/paint": "5c1d9e7",
        "origin/develop": "7f3a1b2",
        "origin/release": "f6a2c5d",
        "origin/wip": "6e2b8d1",
        "origin/main": "7f3a1b2",
        "v0.1.0": "c4f7a1e",
      };

      function ancestorsOf(hash) {
        const seen = new Set();
        const stack = [hash];
        while (stack.length) {
          const current = stack.pop();
          if (!current || seen.has(current)) continue;
          seen.add(current);
          const commit = commitByHash.get(current);
          if (commit) stack.push(...commit.parents);
        }
        return seen;
      }

      const branches = {
        current: "develop",
        detached: false,
        unborn: false,
        head: {
          hash: "7f3a1b2",
          author: "林墨",
          date: hours(1),
          subject: "merge: 合并 feature/git-panel 到 develop",
        },
        local: [
          { name: "develop", hash: "7f3a1b2", current: true, upstream: "origin/develop", ahead: 2, behind: 0, date: hours(1) },
          { name: "feature/git-panel", hash: "3b8f5a1", current: false, upstream: null, ahead: 3, behind: 0, date: hours(6) },
          { name: "hotfix/rename", hash: "a3d8e2f", current: false, upstream: null, ahead: 0, behind: 1, date: hours(47) },
          { name: "experiment/paint", hash: "5c1d9e7", current: false, upstream: null, ahead: 4, behind: 2, date: hours(9) },
        ],
        remote: [
          { name: "origin/develop", hash: "7f3a1b2", date: hours(1) },
          { name: "origin/release", hash: "f6a2c5d", date: hours(58) },
          { name: "origin/wip", hash: "6e2b8d1", date: hours(11) },
          { name: "origin/main", hash: "7f3a1b2", date: hours(1) },
        ],
        tags: [
          { name: "v0.1.0", hash: "c4f7a1e", date: days(5) },
          { name: "v0.0.9", hash: "1b8e4d2", date: days(4.1) },
        ],
        truncated: false,
      };

      const status = {
        isRepo: true,
        root: "/Users/triple3h/work/bailing-ops-statistics",
        workspace: "/Users/triple3h/work/bailing-ops-statistics",
        branch: "develop",
        detached: false,
        unborn: false,
        head: {
          hash: "7f3a1b2c4d5e6f708192a3b4c5d6e7f8091a2b3c",
          author: "林墨",
          date: hours(1),
          subject: "merge: 合并 feature/git-panel 到 develop",
        },
        upstream: "origin/develop",
        ahead: 2,
        behind: 0,
        counts: { staged: 3, unstaged: 3, untracked: 3, conflicted: 0 },
        groups: {
          staged: [
            { path: "src/git/panel.ts", status: "M" },
            { path: "docs/screenshots/commit-view.png", status: "A" },
            { path: "src/git/legacy-name.ts", status: "R", origPath: "src/git/old-name.ts" },
          ],
          unstaged: [
            { path: "src/git/log-view.ts", status: "M" },
            { path: "README.md", status: "M" },
            { path: "src/git/branches.ts", status: "D" },
          ],
          untracked: [
            { path: "src/git/graph.ts", status: "?" },
            { path: "notes/需求.md", status: "?" },
            { path: "dev/harness.html", status: "?" },
          ],
          conflicted: [],
        },
        truncated: false,
      };

      /* ------------------------------------------------------------------ */
      /* Mock data builders                                                  */
      /* ------------------------------------------------------------------ */

      function fileStats(index, path) {
        const statuses = ["M", "M", "A", "D", "R"];
        const status = statuses[index % statuses.length];
        return {
          path,
          status,
          additions: 12 + index * 7,
          deletions: index % 2 === 0 ? 3 + index : 0,
          binary: false,
          ...(status === "R" ? { origPath: path.replace("panel", "panel-old") } : {}),
        };
      }

      function detailFor(hash) {
        const commit =
          commitByHash.get(hash) ||
          commits.find((item) => item.hash.startsWith(hash)) ||
          commits[0];
        const files = [
          fileStats(0, "src/git/panel.ts"),
          fileStats(1, "src/git/log-view.ts"),
          fileStats(2, "src/git/graph.ts"),
          fileStats(3, "src/git/branches.ts"),
          fileStats(4, "src/git/old-name.ts"),
        ];
        return {
          hash: commit.hash,
          short: commit.hash.slice(0, 7),
          parents: commit.parents,
          author: commit.author,
          email: commit.email,
          authoredAt: commit.date,
          committer: commit.author,
          committedAt: commit.date,
          subject: commit.subject,
          body: "合并 feature/git-panel 分支，补齐只读模式下的提交记录视图。\n\n- 泳道图支持合并与多分支\n- 详情面板展示文件列表\n- diff 抽屉支持分页加载",
          merge: commit.parents.length > 1,
          relativeTo: commit.parents.length > 0 ? "first-parent" : "root",
          files,
          truncated: false,
          stats: {
            files: files.length,
            additions: files.reduce((sum, file) => sum + file.additions, 0),
            deletions: files.reduce((sum, file) => sum + file.deletions, 0),
          },
        };
      }

      function makeDiff(path, options) {
        const opts = options || {};
        if (opts.binary) {
          return `diff --git a/${path} b/${path}\nindex 1a2b3c4..5d6e7f8 100644\nBinary files a/${path} and b/${path} differ\n`;
        }
        const header = opts.rename
          ? `diff --git a/${path} b/${opts.rename}\nsimilarity index 92%\nrename from ${path}\nrename to ${opts.rename}\n`
          : opts.created
            ? `diff --git a/${path} b/${path}\nnew file mode 100644\nindex 0000000..5d6e7f8\n--- /dev/null\n+++ b/${path}\n`
            : opts.deleted
              ? `diff --git a/${path} b/${path}\ndeleted file mode 100644\nindex 5d6e7f8..0000000\n--- a/${path}\n+++ /dev/null\n`
              : `diff --git a/${path} b/${path}\nindex 1a2b3c4..5d6e7f8 100644\n--- a/${path}\n+++ b/${path}\n`;
        return (
          header +
          "@@ -1,8 +1,11 @@\n" +
          " import { el } from \"../ui/panel.js\";\n" +
          " import { computeGraph } from \"./graph\";\n" +
          "-const SCALE = 1;\n" +
          "+const SCALE = 2;\n" +
          "+\n" +
          "+function laneColor(index) {\n" +
          "+  return PALETTE[index % PALETTE.length];\n" +
          "+}\n" +
          " export function render(commits) {\n" +
          "-  return commits.map((commit) => commit.subject);\n" +
          "+  const rows = computeGraph(commits);\n" +
          "+  return rows.map((row) => row.svg);\n" +
          " }\n" +
          "@@ -42,6 +45,9 @@ export function render(commits) {\n" +
          "   const meta = { author: commit.author };\n" +
          "   const time = formatRelative(commit.date);\n" +
          "-  return { meta, time };\n" +
          "+  return {\n" +
          "+    meta,\n" +
          "+    time,\n" +
          "+    refs: commit.refs ?? [],\n" +
          "+  };\n" +
          " }\n" +
          "\\ No newline at end of file\n" +
          (opts.extra || "")
        );
      }

      const diffOverrides = {
        "staged:src/git/panel.ts": makeDiff("src/git/panel.ts"),
        "worktree:src/git/log-view.ts": makeDiff("src/git/log-view.ts"),
        "worktree:README.md": makeDiff("README.md"),
        "staged:docs/screenshots/commit-view.png": makeDiff(

        "staged:src/git/legacy-name.ts": makeDiff("src/git/old-name.ts", {
          rename: "src/git/legacy-name.ts",
          extra:
            "@@ -60,7 +60,7 @@ export function select(hash) {\n" +
            "   if (!hash) return;\n" +
            "-  this.selectedHash = hash.slice(0, 7);\n" +
            "+  this.selectedHash = hash;\n" +

            " }\n",
        }),
        "worktree:src/git/branches.ts": makeDiff("src/git/branches.ts", { deleted: true }),
        "untracked:src/git/graph.ts": makeDiff("src/git/graph.ts", { created: true }),
        "untracked:notes/需求.md": makeDiff("notes/需求.md", { created: true }),
        "untracked:dev/harness.html": makeDiff("dev/harness.html", { created: true }),
      };

      /* ------------------------------------------------------------------ */
      /* Tool mock                                                           */
      /* ------------------------------------------------------------------ */

      function textResult(text, structured) {
        return {
          content: [{ type: "text", text: text || "" }],
          structuredContent: structured,
        };
      }

      function mockTool(name, args) {
        if (name === "git_status") {
          return textResult(
            `分支 ${status.branch} · 3 个已暂存 · 3 个未暂存 · 3 个未跟踪`,
            status
          );
        }

        if (name === "git_branches") {
          return textResult("当前分支：develop", branches);
        }

        if (name === "git_log") {
          const branch = args.branch || "all";
          const ancestry = branch === "all" ? null : ancestorsOf(branchTips[branch] || "7f3a1b2");
          let list = commits.filter((commit) => !ancestry || ancestry.has(commit.hash));
          const cursor = Number(args.cursor) || 0;
          const limit = Math.min(Number(args.limit) || 120, 120);
          const page = list.slice(cursor, cursor + limit);
          const nextCursor = cursor + page.length < list.length ? cursor + page.length : null;
          return textResult(
            page.map((commit) => `${commit.short} ${commit.subject}`).join("\n"),
            { commits: page, nextCursor, branch }
          );
        }

        if (name === "git_commit_detail") {
          return textResult("提交详情", detailFor(args.hash));
        }

        if (name === "git_diff") {
          const key = `${args.scope}:${args.path}`;
          const text =
            diffOverrides[key] ||
            makeDiff(args.path, {
              binary: args.path && args.path.endsWith(".png"),
              created: args.scope === "untracked",
            });
          const lines = text.split("\n").length;
          return textResult(text, {
            scope: args.scope,
            path: args.path,
            empty: false,
            binary: /^Binary files /m.test(text),
            next: null,
            totalLines: lines,
          });
        }

        if (name === "git_commit_diff") {
          const text = makeDiff(args.path);
          return textResult(text, {
            hash: args.hash,
            path: args.path,
            empty: false,
            binary: false,
            next: null,
            totalLines: text.split("\n").length,
          });
        }

        return {
          isError: true,
          content: [{ type: "text", text: `unknown tool: ${name}` }],
          structuredContent: { error: { code: "unknown_tool", message: `unknown tool: ${name}` } },
        };
      }
